# Dependabot — automated dependency update PRs.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Production + dev npm dependencies.
  # Grouped updates keep the PR volume manageable; security advisories still
  # open individual PRs via automated-security-fixes (configured in repo settings).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    reviewers:
      - justice8096
    commit-message:
      prefix: chore(deps)
      include: scope
    groups:
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      clerk:
        patterns:
          - "@clerk/*"
      sentry:
        patterns:
          - "@sentry/*"
      # Dev tooling groups patch + minor bumps only. Major bumps (e.g.
      # typescript 5 → 6, vitest 3 → 4) arrive as individual per-package
      # PRs so each can be evaluated on its own — previous bundled PRs
      # (closed #23) were blocked when one package's major introduced
      # breaking changes the others didn't share.
      dev-tooling:
        dependency-type: development
        patterns:
          - "typescript"
          - "tsx"
          - "vitest"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — pin SHAs, update tags weekly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - justice8096
    commit-message:
      prefix: chore(ci)
    # CodeQL init and analyze must run at the same version (the analyze
    # post-step rejects a config written by a different init version), so
    # they are bumped together. Split PRs #159/#161 failed for this reason.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"

  # Dockerfile base-image updates.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - justice8096
    commit-message:
      prefix: chore(docker)
