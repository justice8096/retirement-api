name: Deploy to Rogue

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-rogue
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    timeout-minutes: 15

    steps:
      - name: Install Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy to rogue
        run: |
          # FORCE=1 on manual dispatch: a retry after a failed deploy must not
          # be skipped by the up-to-date guard (the failed run already pulled).
          ssh -o StrictHostKeyChecking=accept-new root@rogue \
            FORCE=${{ github.event_name == 'workflow_dispatch' && '1' || '0' }} \
            bash <<'DEPLOY'
          set -euo pipefail
          cd /srv/retirement/retirement-api

          echo "=== Pulling latest ==="
          git fetch origin
          git -C /srv/retirement/retirement-dashboard-angular fetch origin
          BEHIND=$(git rev-list HEAD..origin/master --count)
          DASH_BEHIND=$(git -C /srv/retirement/retirement-dashboard-angular rev-list HEAD..origin/main --count)
          # Guard checks BOTH repos: a dashboard-only push still needs a
          # deploy, and a prior failed run may have pulled without rebuilding.
          if [ "${FORCE:-0}" != "1" ] && [ "$BEHIND" -eq 0 ] && [ "$DASH_BEHIND" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          echo "api: $BEHIND new commit(s); dashboard: $DASH_BEHIND new commit(s)"
          git log HEAD..origin/master --oneline
          git pull --ff-only origin master

          echo "=== Pulling dashboard (sibling checkout feeds the dashboard image) ==="
          git -C /srv/retirement/retirement-dashboard-angular log HEAD..origin/main --oneline
          git -C /srv/retirement/retirement-dashboard-angular pull --ff-only origin main

          echo "=== Running migrations ==="
          docker compose build --no-cache migrate
          # </dev/null is load-bearing: `compose run` is interactive by
          # default and would swallow the remainder of this heredoc as the
          # container's stdin — leaving the api/dashboard rebuilds below
          # silently unexecuted while the job still reports success.
          docker compose run --rm migrate </dev/null

          echo "=== Rebuilding API ==="
          docker compose build --no-cache api
          docker compose up -d api

          echo "=== Rebuilding Dashboard ==="
          docker compose build --no-cache dashboard
          docker compose up -d dashboard

          echo "=== Health check ==="
          sleep 10
          docker compose ps --format 'table {{.Name}}\t{{.Status}}'

          UNHEALTHY=$(docker compose ps --format json | grep -c '"unhealthy"' || true)
          if [ "$UNHEALTHY" -gt 0 ]; then
            echo "WARNING: $UNHEALTHY unhealthy container(s)"
            docker compose logs --tail=50 api
            exit 1
          fi
          echo "All containers healthy."
          DEPLOY
